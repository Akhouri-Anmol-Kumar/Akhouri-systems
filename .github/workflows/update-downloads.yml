name: Update Download Counter

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-counter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Calculate total downloads
        id: calc
        run: |
          REPOS=("ATLOCK" "ACALCU-v3" "APIC" "ANOTE")
          TOTAL=0
          for REPO in "${REPOS[@]}"; do
            COUNT=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/Akhouri-Anmol-Kumar/$REPO/releases" \
              | jq '[.[].assets[].download_count] | add // 0')
            TOTAL=$((TOTAL + COUNT))
          done

          # One-time correction offset: a repo was deleted and re-uploaded earlier,
          # which permanently wiped 105 real downloads from GitHub's own counters.
          # This adds them back so the number reflects the true history.
          OFFSET=105
          TOTAL=$((TOTAL + OFFSET))

          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"

      - name: Write downloads.json
        run: |
          echo "{\"total\": ${{ steps.calc.outputs.total }}, \"updated\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > downloads.json

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add downloads.json
          git diff --staged --quiet || git commit -m "Update download counter"
          git push
