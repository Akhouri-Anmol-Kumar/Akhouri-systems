name: Update Download Counter

on:
  schedule:
    - cron: '17 * * * *'   # every hour at :17
  workflow_dispatch:
  push:
    paths:
      - 'microsoft-downloads.json'   # recalculate right away when you edit the Store count

permissions:
  contents: write

concurrency:
  group: update-counter
  cancel-in-progress: false

jobs:
  update-counter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Calculate total downloads
        id: calc
        run: |
          REPOS=(
            "Akhouri-Systems/ATLOCK"
            "Akhouri-Systems/ACALCU"
            "Akhouri-Systems/APIC"
            "Akhouri-Systems/ANOTE"
            "Akhouri-Systems/ASNIPP"
          )
          TOTAL=0
          for REPO in "${REPOS[@]}"; do
            COUNT=$(curl -sL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/$REPO/releases?per_page=100" \
              | jq 'if type=="array" then ([.[].assets[].download_count] | add // 0) else 0 end')
            TOTAL=$((TOTAL + COUNT))
          done

          # Permanent correction: 105 real downloads lost when a repo was deleted/re-uploaded
          OFFSET=105
          TOTAL=$((TOTAL + OFFSET))

          # Manual Microsoft Store count (sum of all apps), edited by hand in microsoft-downloads.json
          MS=0
          if [ -f microsoft-downloads.json ]; then
            MS=$(jq -r '.count // 0' microsoft-downloads.json 2>/dev/null || echo 0)
          fi
          case "$MS" in ''|*[!0-9]*) MS=0 ;; esac
          echo "GitHub+offset=$TOTAL, Microsoft Store=$MS"
          TOTAL=$((TOTAL + MS))

          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"

      - name: Write downloads.json
        run: |
          echo "{\"total\": ${{ steps.calc.outputs.total }}, \"updated\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > downloads.json

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add downloads.json
          git diff --staged --quiet || git commit -m "Update download counter"
          git pull --rebase origin ${{ github.ref_name }}
          git push
